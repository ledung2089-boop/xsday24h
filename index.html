    <script>
      (function() {
        try {
          var origFetch = window.fetch;
          var activeFetch = typeof origFetch === 'function' ? origFetch.bind(window) : origFetch;
          var desc = {
            configurable: true,
            enumerable: true,
            get: function() {
              return activeFetch;
            },
            set: function(v) {
              activeFetch = v;
            }
          };
          try {
            Object.defineProperty(window, 'fetch', desc);
          } catch (e1) {
            try {
              delete window.fetch;
              Object.defineProperty(window, 'fetch', desc);
            } catch (e2) {}
          }
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', desc);
            }
          } catch (e3) {}
        } catch (err) {}
      })();
    </script>
